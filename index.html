<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalastuslokikirja</title>
    <!-- FontAwesome kuvakkeet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="config.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .weather-card {
            background-color: #334155;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .weather-location {
            font-size: 18px;
            font-weight: bold;
            color: #f43f5e;
            margin-bottom: 8px;
        }
        .weather-pressure {
            font-size: 28px;
            font-weight: bold;
            color: #4ade80;
        }
        .weather-details {
            font-size: 14px;
            margin-top: 8px;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #94a3b8;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .error-msg {
            color: #f87171;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1><i class="fas fa-fish"></i> Kalastuslokikirja</h1>

        <!-- Sää- ja ottihetkikortti -->
        <div class="weather-card" id="weatherCard">
            <div class="weather-location"><i class="fas fa-map-marker-alt"></i> Helsinki, Finland</div>
            <div class="weather-pressure">1013.2 hPa</div>
            <div style="color: #fbbf24; font-weight: bold; font-size: 15px;">Nouseva / Korkea paine</div>
            <div class="weather-details">
                Lämpötila: 15.3 °C<br>
                Tuuli: 13.3 m/s (lounaasta (SW))<br>
                Veden lämpötila: 17.6 °C
            </div>
            <!-- Ottihetki-arvioelementti -->
            <div id="fishingPulseContainer" style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #475569;"></div>
        </div>

        <!-- Saaliin tallennuslomake -->
        <div class="form-group">
            <label for="species">Kalalaji</label>
            <input type="text" id="species" placeholder="Esim. Hauki, Ahven">
        </div>

        <div class="form-group">
            <label for="passwordInput">Salasana (vaaditaan tallennukseen)</label>
            <input type="password" id="passwordInput" placeholder="Kirjoita salasana">
            <div id="errorMsg" class="error-msg">Virheellinen salasana! Et voi tallentaa saalista ilman oikeaa salasanaa.</div>
        </div>

        <button onclick="saveCatch()">Tallenna saalis</button>
    </div>

    <script>
        // Ottihetken arviointifunktio säätietojen perusteella
        function updateFishingPulse(trend, windSpeed) {
            let text = "Normaali ottihetki";
            let color = "#38bdf8"; // Oletus sininen/vaalea

            if (trend && trend.toLowerCase().includes("nouseva")) {
                text = "Erinomainen ottihetki! (Korkeapaine nousee)";
                color = "#4ade80"; // Vihreä
            } else if (windSpeed > 10) {
                text = "Haastava ottihetki (Kova tuuli)";
                color = "#f87171"; // Punainen
            } else if (trend && trend.toLowerCase().includes("laskeva")) {
                text = "Tyydyttävä ottihetki (Laskeva paine)";
                color = "#fbbf24"; // Keltainen
            }

            const container = document.getElementById('fishingPulseContainer');
            container.innerHTML = `<strong>Ottihetki:</strong> <span style="color: ${color}; font-weight: bold;">${text}</span>`;
        }

        // Suoritetaan sivun latautuessa
        window.onload = function() {
            // Asetetaan esimerkkitiedoille arvio (tähän voi kytkeä dynaamisen sään lukijan)
            updateFishingPulse("Nouseva", 13.3);
        };

        // Tallennusfunktio salasanan tarkistuksella
        function saveCatch() {
            const passInput = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            // Tarkistetaan salasana config.js-tiedostosta
            if (typeof APP_CONFIG !== 'undefined' && passInput === APP_CONFIG.PASSWORD) {
                errorMsg.style.display = 'none';
                alert("Salasana oikein! Saalis tallennetaan Google Driveen...");
                // Tähän tulee varsinainen tallennuslogiikka Driveen
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
