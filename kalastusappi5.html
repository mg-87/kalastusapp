<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalapaine - Sää & Ilmanpaine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-green: #4ade80;
            --accent-orange: #fb923c;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 4px;
            color: var(--accent);
        }
        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 0;
        }
        .search-row {
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1rem;
        }
        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pressure-val {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--accent-green);
        }
        .location {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        /* Korjattu luokka: estää tekstien katkeamisen ja rivittymisen rikki */
        .weather-details {
            text-align: right;
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        button {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .secondary-btn {
            background-color: var(--border-color);
            color: var(--text-color);
            width: 100%;
        }
        .species-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 100%;
            margin-top: 8px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
        }
        .species-btn:hover {
            background-color: #334155;
        }
        .back-btn {
            background-color: var(--border-color);
            color: var(--text-color);
            margin-bottom: 16px;
            width: 100%;
        }
        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
        .hidden {
            display: none;
        }
        .detail-row {
            margin-bottom: 14px;
        }
        .detail-row strong {
            color: var(--accent);
            display: block;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- PÄÄNÄKYMÄ -->
    <div id="main-view">
        <h1>Kalapaine 🎣</h1>
        <div class="subtitle">Sää, Ilmanpaine & Veden lämpötila</div>

        <div class="card">
            <div class="search-box">
                <div class="search-row">
                    <input type="text" id="cityInput" placeholder="Paikkakunta (esim. Tampere)" onkeypress="handleKeyPress(event)">
                    <button onclick="searchCity()">Hae</button>
                </div>
                <button class="secondary-btn" onclick="getLocationByGPS()">📍 Käytä laitteen GPS-sijaintia</button>
            </div>
        </div>

        <div id="content">
            <div class="loading">Ladataan säätietoja...</div>
        </div>

        <div id="species-menu" class="hidden">
            <div style="font-weight: bold; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px;">Lajikohtaiset täsmätiedot:</div>
            <button class="species-btn" onclick="openSpecies('ahven')"><span>Ahven</span> <span>&rarr;</span></button>
            <button class="species-btn" onclick="openSpecies('kuha')"><span>Kuha</span> <span>&rarr;</span></button>
            <button class="species-btn" onclick="openSpecies('hauki')"><span>Hauki</span> <span>&rarr;</span></button>
        </div>
    </div>

    <!-- LAJIKOHTAINEN SIVU -->
    <div id="species-view" class="hidden">
        <button class="back-btn" onclick="closeSpecies()">&larr; Takaisin yleisnäkymään</button>
        <h1 id="species-title" style="text-align: left; margin-bottom: 16px;">Laji</h1>
        
        <div class="card">
            <div style="font-size: 0.9rem; color: var(--text-muted);">Vallitseva sää & painetila:</div>
            <div id="species-current-pressure" style="font-size: 1.05rem; font-weight: bold; color: var(--accent); margin-top: 2px;">--</div>
        </div>

        <div class="card">
            <div class="detail-row">
                <strong>Odotettu sijainti / syvyys (sään mukaan):</strong>
                <p id="spec-location" style="margin: 0; color: var(--text-muted); font-size: 0.95rem;">Ladataan...</p>
            </div>

            <div class="detail-row">
                <strong>Viehetyyppi ja uitto:</strong>
                <p id="spec-action" style="margin: 0; color: var(--text-muted); font-size: 0.95rem;">Ladataan...</p>
            </div>

            <div class="detail-row" style="margin-bottom: 0;">
                <strong>Suositellut värit:</strong>
                <p id="spec-colors" style="margin: 0; color: var(--text-muted); font-size: 0.95rem;">Ladataan...</p>
            </div>
        </div>
    </div>
</div>

<script>
    let globalData = null;
    let globalLocationName = "";
    let currentPressureVal = 1013;
    let currentTrendStatus = "vakaa";
    let currentWindVal = 0;
    let currentTempVal = 15;

    window.onload = function() {
        const savedCity = localStorage.getItem("kalapaine_city");
        if (savedCity) {
            document.getElementById("cityInput").value = savedCity;
            fetchCoordsByCity(savedCity);
        } else {
            fetchLocationByIP();
        }
    };

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            searchCity();
        }
    }

    async function searchCity() {
        const cityName = document.getElementById("cityInput").value.trim();
        if (!cityName) return;

        document.getElementById("content").innerHTML = `<div class="loading">Etsitään paikkaa "${cityName}"...</div>`;
        document.getElementById("species-menu").classList.add("hidden");

        try {
            const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=fi`);
            const data = await response.json();

            if (!data.results || data.results.length === 0) {
                document.getElementById("content").innerHTML = `<div class="card"><p style="margin:0; text-align:center;">Paikkakuntaa ei löytynyt. Tarkista kirjoitusasu.</p></div>`;
                return;
            }

            const place = data.results[0];
            localStorage.setItem("kalapaine_city", place.name);
            fetchWeatherData(place.latitude, place.longitude, `${place.name} (${place.country || ''})`);
        } catch (error) {
            document.getElementById("content").innerHTML = `<div class="card"><p style="margin:0; text-align:center;">Haku epäonnistui. Tarkista verkkoyhteys.</p></div>`;
        }
    }

    async function fetchCoordsByCity(cityName) {
        try {
            const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=fi`);
            const data = await response.json();
            if (data.results && data.results.length > 0) {
                const place = data.results[0];
                fetchWeatherData(place.latitude, place.longitude, place.name);
            } else {
                fetchLocationByIP();
            }
        } catch (e) {
            fetchLocationByIP();
        }
    }

    async function fetchLocationByIP() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            if (data.latitude && data.longitude) {
                const locationName = `${data.city || 'Tuntematon'}, ${data.country_name || ''}`;
                fetchWeatherData(data.latitude, data.longitude, locationName);
            } else {
                fetchCoordsByCity("Helsinki");
            }
        } catch (e) {
            fetchCoordsByCity("Helsinki");
        }
    }

    function getLocationByGPS() {
        if (!navigator.geolocation) {
            alert("Sijaintitietoja ei tueta selaimessasi. Haetaan paikkakunta IP:n kautta...");
            fetchLocationByIP();
            return;
        }
        document.getElementById("content").innerHTML = `<div class="loading">Paikannetaan laitetta GPS:llä...</div>`;
        document.getElementById("species-menu").classList.add("hidden");

        navigator.geolocation.getCurrentPosition((position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            fetchWeatherData(lat, lon, `Oma GPS-sijainti (${lat.toFixed(2)}, ${lon.toFixed(2)})`);
        }, (error) => {
            document.getElementById("content").innerHTML = `<div class="loading">GPS estetty/epäonnistui. Haetaan sijainti automaattisesti...</div>`;
            fetchLocationByIP();
        }, { timeout: 10000 });
    }

    async function fetchWeatherData(lat, lon, locationName) {
        globalLocationName = locationName;
        try {
            const weatherPromise = fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,surface_pressure,pressure_msl,wind_speed_10m&hourly=pressure_msl`);
            const marinePromise = fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=sea_surface_temperature`).catch(() => null);

            const [weatherRes, marineRes] = await Promise.all([weatherPromise, marinePromise]);
            const data = await weatherRes.json();

            let waterTemp = null;
            if (marineRes && marineRes.ok) {
                const marineData = await marineRes.json();
                if (marineData.current && marineData.current.sea_surface_temperature !== undefined) {
                    waterTemp = marineData.current.sea_surface_temperature;
                }
            }

            data.water_temperature = waterTemp;
            globalData = data;
            renderUI(data, locationName);
            document.getElementById("species-menu").classList.remove("hidden");
        } catch (error) {
            document.getElementById("content").innerHTML = `<div class="card"><p style="margin:0; text-align:center;">Säätietojen haku epäonnistui.</p></div>`;
        }
    }

    function renderUI(data, locationName) {
        const current = data.current;
        currentPressureVal = current.pressure_msl || current.surface_pressure;
        currentTempVal = current.temperature_2m;
        currentWindVal = current.wind_speed_10m;
        const waterTemp = data.water_temperature;

        let trendText = "Vakaa paine";
        let trendColor = "#38bdf8";
        currentTrendStatus = "vakaa";

        if (data.hourly && data.hourly.pressure_msl) {
            const nowIndex = 12; 
            const pastPressure = data.hourly.pressure_msl[nowIndex - 3] || currentPressureVal;
            const diff = currentPressureVal - pastPressure;
            if (diff < -0.8) {
                trendText = "Laskeva paine (Erinomainen syöntipiikki)";
                trendColor = "#4ade80";
                currentTrendStatus = "matala";
            } else if (diff > 0.8) {
                trendText = "Nouseva / Korkea paine";
                trendColor = "#fb923c";
                currentTrendStatus = "korkea";
            }
        }

        const waterTempHtml = waterTemp !== null && waterTemp !== undefined 
            ? `Veden lämpötila: <b>${waterTemp} °C</b><br>` 
            : `Veden lämpötila: <span style="color:var(--text-muted); font-size:0.85rem;">Ei saatavilla (sisävesi)</span><br>`;

        const html = `
            <div class="card">
                <div class="location">📍 ${locationName}</div>
                <div class="weather-main">
                    <div>
                        <div class="pressure-val">${currentPressureVal} <span style="font-size: 1rem; color: var(--text-muted);">hPa</span></div>
                        <div style="color: ${trendColor}; font-weight: bold; font-size: 0.85rem; margin-top: 4px;">${trendText}</div>
                    </div>
                    <div class="weather-details">
                        Lämpötila: <b>${currentTempVal} °C</b><br>
                        Tuuli: <b>${currentWindVal} m/s</b><br>
                        ${waterTempHtml}
                    </div>
                </div>
            </div>
        `;

        document.getElementById("content").innerHTML = html;
    }

    function openSpecies(species) {
        document.getElementById("main-view").classList.add("hidden");
        document.getElementById("species-view").classList.remove("hidden");
        document.getElementById("species-current-pressure").innerText = `${currentPressureVal} hPa | Tuuli: ${currentWindVal} m/s | Lämpö: ${currentTempVal} °C`;

        const titleEl = document.getElementById("species-title");
        const locEl = document.getElementById("spec-location");
        const actionEl = document.getElementById("spec-action");
        const colorsEl = document.getElementById("spec-colors");

        let windDesc = "";
        if (currentWindVal < 3) {
            windDesc = "Tuuli on heikkoa tai tyyntä: kalat saattavat olla hajallaan laajemmilla alueilla ja pinnan tuntumassa.";
        } else if (currentWindVal >= 3 && currentWindVal <= 7) {
            windDesc = "Kohtalainen tuuli: rikkoo veden pintaa ja aktivoi kalat ruokailemaan tuulen puoleisille rannoille ja matalikoille.";
        } else {
            windDesc = "Kova tuuli: hakeudu suojaisiin lahtiin, salmiin ja saarten leveille puoleneille syvemmän veden reunoille.";
        }

        if (species === 'ahven') {
            titleEl.innerText = 'Ahvenen täsmätiedot';
            if (currentTrendStatus === 'korkea') {
                locEl.innerText = `Korkea/vakaa paine. ${windDesc} Etsi ahventa syvemmiltä penkoilta, kivikoiden reunoilta ja pohjan montuista (4–8 m).`;
                actionEl.innerText = 'Erittäin hidas jigaus, pitkät pohjassa viipymiset ja kevyet herättelevät nyppäykset.';
                colorsEl.innerText = 'Luonnolliset sävyt: muikku, kuore, moottoriöljy (motor oil), ruskea ja kirkas hile.';
            } else if (currentTrendStatus === 'matala') {
                locEl.innerText = `Laskeva paine / syöntipiikki! ${windDesc} Ahven nousee aktiivisesti matalaan: kaislikoiden reunoille, karikoiden laille ja virtapaikkoihin (1–3 m).`;
                actionEl.innerText = 'Nopeampi ja aggressiivisempi uitto, aktiivinen vieheen nyppiminen ja pompautus.';
                colorsEl.innerText = 'Ärsyke- ja kirkkaat värit: chartreuse (neonkeltainen), firetiger, kirkas oranssi ja pinkki.';
            } else {
                locEl.innerText = `Normaali painetila. ${windDesc} Perinteiset vedenalaiset nyppylät ja matalikon reunat (2–5 m).`;
                actionEl.innerText = 'Normaali tasainen jigin kelaus tai herkkä dropshot-kalastus.';
                colorsEl.innerText = 'Perusvärit: vihreäselkäinen, helmiäinen ja kuparinen sävy.';
            }
        } else if (species === 'kuha') {
            titleEl.innerText = 'Kuhan täsmätiedot';
            if (currentTrendStatus === 'korkea') {
                locEl.innerText = `Korkea paine. ${windDesc} Kuha painautuu syvälle: syvänteiden reunat, salmien pohjat ja syvät kuopat (6–12 m).`;
                actionEl.innerText = 'Tarkkaa pohjassa pysyttelyä, erittäin rauhallinen ja hidas vertikaalijigaus tai pohjaonkitaktiikka.';
                colorsEl.innerText = 'Tummat ja luonnolliset värit: tumma violetti, mustaselkäinen helmiäinen ja kuoreen vivahtavat.';
            } else if (currentTrendStatus === 'matala') {
                locEl.innerText = `Laskeva paine / aktiivinen syönti. ${windDesc} Kuha nousee matalampiin penkoille ja väliveteen ruokailemaan (2–5 m).`;
                actionEl.innerText = 'Aktiivinen vaapun veto tai hieman nopeampi jigin uitto välivedestä / penkan päältä.';
                colorsEl.innerText = 'Kontrastivärit: fluorikeltainen, valkoinen isolla punaisella päällä tai ärsykesävyt.';
            } else {
                locEl.innerText = `Normaali paine. ${windDesc} Tyypilliset kynnökset, penkan reunat ja vedenalaiset selänteet (4–7 m).`;
                actionEl.innerText = 'Perinteinen jigikalastus pohjan tuntumassa tai rauhallinen vetouistelu.';
                colorsEl.innerText = 'Luomu- ja perusvärit: muikku, kulta/oranssi pohja ja helmiäinen.';
            }
        } else if (species === 'hauki') {
            titleEl.innerText = 'Hauen täsmätiedot';
            if (currentTrendStatus === 'korkea') {
                locEl.innerText = `Korkea paine. ${windDesc} Hauki seisoo syvemmissä kaislikon reunoissa, pakoilla ja avoveden penkoilla (3–6 m).`;
                actionEl.innerText = 'Raskaat jerkit tai isot kumivieheet pitkillä liu\'uilla ja pitkillä pysäytyksillä.';
                colorsEl.innerText = 'Hauen omat luonnolliset kuosit, luonnonvihreä, hauen nahka ja neutraali hopea.';
            } else if (currentTrendStatus === 'matala') {
                locEl.innerText = `Laskeva paine / syöntipiikki! ${windDesc} Hauki on aivan matalassa: kaislikoiden sisällä, lahdissa ja matalilla salmilla (0.5–2 m).`;
                actionEl.innerText = 'Äänekkäät pinnan läheiset vieheet, spinnerbaitit ja vaaput nopeammalla uitolla.';
                colorsEl.innerText = 'Ärsykevärit ja fluoresoivat sävyt: kirkas oranssi, firetiger, pinkki ja isot kontrastit.';
            } else {
                locEl.innerText = `Normaali paine. ${windDesc} Kaislikoiden reunat, kynnökset ja avoimemmat karikot (1.5–4 m).`;
                actionEl.innerText = 'Perusvarma hauenkalastus lusikoilla, vaapuilla tai jerkeillä.';
                colorsEl.innerText = 'Perusvarmat: punavalkoinen, ahvenkuosi ja kulta-vihreä.';
            }
        }
    }

    function closeSpecies() {
        document.getElementById("species-view").classList.add("hidden");
        document.getElementById("main-view").classList.remove("hidden");
    }
</script>

</body>
</html>
